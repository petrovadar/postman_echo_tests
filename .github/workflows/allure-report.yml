name: Allure Report

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest
      
      - name: Run tests with Allure
        run: |
          pytest test_echo_allure.py --alluredir=./allure-results -v
      
      - name: Download Allure
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -xzf allure-2.29.0.tgz
      
      - name: Generate Allure report
        run: |
          ./allure-2.29.0/bin/allure generate ./allure-results --clean -o ./allure-report
      
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./allure-report
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
